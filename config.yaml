# bird-fine-classifier: カモ類 AST分類器の設定

# ==================================================
# 対象種（Xeno-canto英名 ↔ 学名 ↔ 日本語名）
# ==================================================
target_species:
  - en: "Mallard"
    sci: "Anas platyrhynchos"
    ja: "マガモ"
  - en: "Eurasian Teal"
    sci: "Anas crecca"
    ja: "コガモ"
  - en: "Northern Pintail"
    sci: "Anas acuta"
    ja: "オナガガモ"
  - en: "Northern Shoveler"
    sci: "Spatula clypeata"
    ja: "ハシビロガモ"
  - en: "Eurasian Wigeon"
    sci: "Mareca penelope"
    ja: "ヒドリガモ"
  - en: "Tufted Duck"
    sci: "Aythya fuligula"
    ja: "キンクロハジロ"
  - en: "Common Goldeneye"
    sci: "Bucephala clangula"
    ja: "ホオジロガモ"
  - en: "Common Pochard"
    sci: "Aythya ferina"
    ja: "ホシハジロ"
  # run13→run15: 昇格成功の2種のみ target に残す（カルガモ/カワアイサは other へ差戻し）
  - en: "Gadwall"
    sci: "Mareca strepera"
    ja: "オカヨシガモ"
  - en: "Red-breasted Merganser"
    sci: "Mergus serrator"
    ja: "ウミアイサ"

# ==================================================
# ダウンロード設定
# ==================================================
download:
  output_dir: "data/raw"
  quality: "A"                       # A: 最高品質、B: 高品質も含めるなら "A B"
  max_recordings_per_species: 100
  # 検索フォールバック: Japan -> worldwide
  countries: ["Japan"]
  fallback_worldwide: true

# ==================================================
# 前処理設定
# ==================================================
preprocessing:
  sample_rate: 16000               # ASTの仕様
  chunk_duration_sec: 3.0          # BirdNetの3s窓に合わせる
  min_chunk_duration_sec: 1.0      # 3s切り出し後の端数チャンクを救う
  overlap_ratio: 0.0               # チャンク間のオーバーラップ（0で重複なし）
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42

# ==================================================
# モデル設定
# ==================================================
model:
  pretrained: "MIT/ast-finetuned-audioset-10-10-0.4593"
  num_labels: 11                   # run15: 10種 + "other"（Gadwall/ウミアイサのみ昇格成功）
  feature_extractor_max_length: 304  # 3s×16kHz のmelフレーム数（10s=1024の3/10）
  init_from: ""                      # run13: pretrained から初期化（12種で label 順序が変わり run11 ヘッド流用不可）

# ==================================================
# 学習設定
# ==================================================
training:
  output_dir: "models/ast-duck-v15"  # run15: 10種運用で確定、v13/v14保護
  focal_gamma: 0.0                   # run15: 従来CEに戻す（run14 focal は失敗）
  num_train_epochs: 15
  per_device_train_batch_size: 4   # RTX 3060 Ti (VRAM 8GB) 想定
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4   # effective batch = 16
  learning_rate: 2.0e-5
  warmup_ratio: 0.1
  weight_decay: 0.03
  fp16: true
  gradient_checkpointing: true
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "f1_macro_8class"  # 既存8種のF1でモデル選択（"other"に引きずられない）
  early_stopping_patience: 4
  logging_steps: 20
  report_to: ["tensorboard"]

# ==================================================
# データ拡張（train_dsのみ適用）
# ==================================================
augmentation:
  spec_augment:
    enabled: false                 # 8種には適用しない（run06で境界破壊を確認）
    other_only: true               # "other"クラスにのみ適用（過学習防止）
    freq_mask_param: 24
    time_mask_param: 80
    num_freq_masks: 2
    num_time_masks: 2

# ==================================================
# "other" クラス設定
# ==================================================
other_class:
  recordings_for_train: 20        # 種あたり train に使う録音数
  recordings_for_eval: 10         # 種あたり val に使う録音数
  max_chunks_per_recording: 30    # per-recording cap（run08の教訓）
  loss_alpha: 1.5                 # CE loss の "other" クラス重み（Recall 重視）
  seed: 42
  # Tier1: カモ科他種（パイプライン上で最も重要なOOD）
  # run15: カルガモ/カワアイサを other へ差戻し（Gadwall/ウミアイサのみ target 昇格成功）
  tier1_species:
    - "Eastern Spot-billed Duck"
    - "Common Merganser"
    - "Baikal Teal"
    - "Falcated Duck"
  # Tier2: 水辺の非カモ科（声質多様性のため）
  tier2_species:
    - "Eurasian Coot"
    - "Little Grebe"

# ==================================================
# 評価設定
# ==================================================
evaluation:
  output_dir: "outputs"
  attention_visualization: true
  top_k: 3

# ==================================================
# Foundation Model 埋め込み＋プローブ（AST頭打ち打開の別系統）
# 抽出は隔離環境（tools/perch_embed=TF, tools/aves_embed=torch）で .npz に出力。
# プローブ学習/評価は tools/aves_embed の torch 環境で実行。
# ==================================================
embeddings:
  cache_dir: "data/embeddings"        # {model}/{split}.npz
  perch:
    variant: "perch_v2"               # CPU機では perch_v2_cpu を Kaggle から自動取得
    sample_rate: 32000
    window_size_sec: 5.0              # Perch native（10秒チャンク→2窓→平均）
    embedding_dim: 1536
    source: "raw"                     # raw=生mp3を32kHz再デコード（高忠実）/ processed=16kHz resample
  birdaves:
    weights_dir: "references/weights/birdaves"
    model_file: "birdaves-biox-large.torchaudio.pt"
    config_file: "birdaves-biox-large.torchaudio.model_config.json"
    sample_rate: 16000
    embedding_dim: 1024
    seq_tokens: 32                    # attentiveプローブ用に系列を固定長プーリング

probe:
  # レビュー論文(arXiv:2508.01277)準拠の既定ハイパラ
  lr: 0.005
  weight_decay: 0.0005
  epochs: 50
  batch_size: 128
  class_weights: true                 # データ不均衡（録音数のばらつき）対策
  mlp_hidden_dim: 256
  mlp_dropout: 0.3
  attentive_num_heads: 4
  metric_for_best: "f1_macro"         # AST baseline と同指標で比較（現行ベスト test 0.838）

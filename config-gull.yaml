# bird-fine-classifier: カモメ類(gull) AST分類器の設定
# 多群化の3例目。crow の config を雛形に、群固有部(対象種/splits/output/num_labels/OOD)だけ差し替え。
# 前処理(3s/16k)・モデル基盤(AST)・学習ハイパラは duck/crow と共有方針。
# 群=gull。species_master.csv の group==gull と整合。

# ==================================================
# 対象種（Xeno-canto英名 ↔ 学名 ↔ 日本語名）= species_master の gull target 6種
# ※en は XC API で件数実測して確定（2026-06-14）。セグロカモメは Herring Gull(欧州別種)でなく Vega Gull が正。
# ==================================================
target_species:
  - en: "Black-tailed Gull"
    sci: "Larus crassirostris"
    ja: "ウミネコ"
  - en: "Black-headed Gull"
    sci: "Chroicocephalus ridibundus"
    ja: "ユリカモメ"
  - en: "Vega Gull"
    sci: "Larus vegae"
    ja: "セグロカモメ"
  - en: "Slaty-backed Gull"
    sci: "Larus schistisagus"
    ja: "オオセグロカモメ"
  - en: "Common Gull"
    sci: "Larus canus"
    ja: "カモメ"
  - en: "Saunders's Gull"
    sci: "Saundersilarus saundersi"
    ja: "ズグロカモメ"

# ==================================================
# ダウンロード設定（カモメは薄種あり=A B 両grade + worldwide fallback で確実に）
# ==================================================
download:
  output_dir: "data/raw"             # 種サブディレクトリ共有（duck/crow と同居）
  quality: "A B"                     # multigrade（download.py = q:A / q:B 別投げ統合）
  max_recordings_per_species: 100
  countries: ["Japan"]
  fallback_worldwide: true

# ==================================================
# 前処理設定（共有。splits だけ群別）
# ==================================================
preprocessing:
  sample_rate: 16000
  chunk_duration_sec: 3.0
  min_chunk_duration_sec: 1.0
  overlap_ratio: 0.0
  processed_dir: "data/processed"    # 種サブディレクトリ共有
  splits_dir: "data/splits-gull"     # 群別（他群と分離）。ドライバの SPLITS 既定値
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42

# ==================================================
# モデル設定（6種 + other）
# ==================================================
model:
  pretrained: "MIT/ast-finetuned-audioset-10-10-0.4593"
  num_labels: 7                      # 6カモメ + "other"
  feature_extractor_max_length: 304  # 3s×16kHz
  init_from: ""

# ==================================================
# 学習設定（duck/crow と同ハイパラ。output_dir は run/seed ごとに --output-dir で上書き）
# ==================================================
training:
  output_dir: "models/ast-gull-base"
  focal_gamma: 0.0
  num_train_epochs: 15
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  warmup_ratio: 0.1
  weight_decay: 0.03
  fp16: true
  gradient_checkpointing: true
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "f1_macro"  # 群非依存の汎用指標
  early_stopping_patience: 4
  logging_steps: 20
  report_to: ["tensorboard"]

# ==================================================
# データ拡張（train_dsのみ）
# ==================================================
augmentation:
  spec_augment:
    enabled: false
    other_only: true
    freq_mask_param: 24
    time_mask_param: 80
    num_freq_masks: 2
    num_time_masks: 2

# ==================================================
# "other" クラス設定（学習時OE = 非対象カモメ類 + 非カモメ近接音）
# ※ tier 種は train/ood 段の前に XC 英名を実測確定する（[要XC名前確認]）。Phase4 ゲートは species_master の gull ood_tier* を使用。
# ==================================================
other_class:
  recordings_for_train: 20
  recordings_for_eval: 10
  max_chunks_per_recording: 30
  loss_alpha: 1.5
  seed: 42
  # Tier1: 同科他種（最重要OOD = 対象外 Laridae = 他カモメ/アジサシ類） [要XC名前確認]
  tier1_species:
    - "Black-legged Kittiwake"
    - "Common Tern"
    - "Little Tern"
  # Tier2: 非カモメの近接海岸音（声質多様性） [要XC名前確認]
  tier2_species:
    - "Great Cormorant"
    - "Eurasian Curlew"

# ==================================================
# 評価設定
# ==================================================
evaluation:
  output_dir: "outputs"
  attention_visualization: true
  top_k: 3

# ==================================================
# Foundation Model 埋め込み（Full手法=Perch蒸留 用。duck/crow と共有）
# ==================================================
embeddings:
  cache_dir: "data/embeddings"
  perch:
    variant: "perch_v2"
    sample_rate: 32000
    window_size_sec: 5.0
    embedding_dim: 1536
    source: "raw"
  birdaves:
    weights_dir: "references/weights/birdaves"
    model_file: "birdaves-biox-large.torchaudio.pt"
    config_file: "birdaves-biox-large.torchaudio.model_config.json"
    sample_rate: 16000
    embedding_dim: 1024
    seq_tokens: 32

probe:
  lr: 0.005
  weight_decay: 0.0005
  epochs: 50
  batch_size: 128
  class_weights: true
  mlp_hidden_dim: 256
  mlp_dropout: 0.3
  attentive_num_heads: 4
  metric_for_best: "f1_macro"

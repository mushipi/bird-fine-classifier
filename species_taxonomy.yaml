# species_taxonomy.yaml
# Stage2 AST パイプラインの設定ファイル。
# 種リストの管理は data/species_master.csv が主マスタ。
# このファイルはモデルパス・閾値・温度パラメータのみを保持する。
#
# Dispatcher のルーティングテーブル（stage2_triggers）は
# species_master.csv から動的に生成する:
#   triggers = master[(master.group == group) &
#                     (master.status.isin(["target", "ood_tier1"]))]["en_birdnet"]
#
# energy スコア規約:
#   score = T * logsumexp(logits / T)  （高い = in-distribution）
#   softmax confidence とは別物。混同注意。

# ==================================================
# カモ類グループ
# ==================================================
duck:
  pipeline:
    stage2_model: "models/ast-duck-v15"   # ★暫定★ 精度差は統計的に無意味(test 69録音)。
    # test拡大→複数シード学習→CI選定 の後に正式モデルを再選定する(→ experiments.md 冒頭の但し書き)
    # run15 ood_eval (2026-06-05): 10種運用, AUROC energy=0.899 / FPR<=5% 推奨値
    # （旧 run11 9クラス: threshold 10.35 / AUROC 0.932。11クラス化で energy スケール変化）
    energy_threshold: 6.73
    energy_temperature: 1.0  # 1.0 = Temperature Scaling なし

# ==================================================
# カラス類グループ（実装予定）
# ==================================================
crow:
  pipeline:
    stage2_model: null          # TBD: models/ast-crow-v1
    energy_threshold: null      # TBD: 学習・ood_eval 後に設定
    energy_temperature: 1.0

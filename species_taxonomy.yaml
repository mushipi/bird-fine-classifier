# species_taxonomy.yaml
# Stage2 AST パイプラインの設定ファイル。
# 種リストの管理は data/species_master.csv が主マスタ。
# このファイルはモデルパス・閾値・温度パラメータのみを保持する。
#
# Dispatcher のルーティングテーブル（stage2_triggers）は
# species_master.csv から動的に生成する:
#   triggers = master[(master.group == group) &
#                     (master.status.isin(["target", "ood_tier1"]))]["en_birdnet"]
#
# energy スコア規約:
#   score = T * logsumexp(logits / T)  （高い = in-distribution）
#   softmax confidence とは別物。混同注意。

# ==================================================
# カモ類グループ
# ==================================================
duck:
  pipeline:
    stage2_model: "models/ast-duck-D-base-soup"   # 2026-06-13: test拡大Cv2 の base soup(蒸留なし)を昇格
    # 経緯: 10種運用。前運用 C-kd-soup の従来値(0.871/0.910)は test への学習リーク(45%)膨張で、
    #   honest 再評価(リークフリー159録音)では C-kd-soup 0.787 < D-base-soup 0.897(+0.110 95%CI[+0.042,+0.172]=有意)。
    #   伸びの主因は test拡大(再split+B級worldwide, 1020→1288録音)とクリーンsplitで、蒸留ではない
    #   (AST最終soupでは KD 乗らず clean で base>KD 有意)。詳細→ docs/perch_kd_report.md §13。
    # 2026-06-13 新モデルで OOD energy ゲート再キャリブレ(tools/ood_fp_audit.py, 録音平均energy):
    #   モデル変更で energy 分布が上方シフト→旧2.717では非カモFP0.88(ゲート実質無効)。再導出必須だった。
    #   録音単位AUROC(真カモvs非カモ)=0.901。動作点=「真カモ最優先・保持>=0.90」を採用:
    #   閾値3.081で 真カモ保持0.90 / 非カモ類FP0.33 / 対象外カモ漏れ0.48。
    #   対象外カモ類(カルガモ等)の漏れは分類側の構造課題として受容。
    #   閾値はXeno-canto域の暫定=デプロイ後フィールド再キャリブレ必須(全体設計書 §9)。
    # 旧: C-kd-soup 2.717(保持0.90,FP0.22,AUROC0.932), chunk導出2.948, v15(11クラス)6.73。
    energy_threshold: 3.081
    energy_temperature: 1.0  # 1.0 = Temperature Scaling なし
  # 出力タクソノミ: 音響的に分離不能な種を複合(slash分類群)で出す（適応的解像度・再学習不要）。
  # 内部クラス→複合表示。記載の無い種は species_master の和名で素通り。
  # 2026-06-12: Perch2.0本体でもカルガモ↔マガモ分離不能(0/30)と実証→複合化(tools/perch_native_confusion.py)。
  # カルガモはモデル上Mallardに化けるので、Mallard予測=この複合を表す。最頻種カルガモを捨てない。
  display_groups:
    Mallard:
      label: "マガモ/カルガモ"
      sci: "Anas platyrhynchos/zonorhyncha"

# ==================================================
# カラス類グループ
# ==================================================
crow:
  pipeline:
    # 2026-06-14 登録: 4種(ハシブト/ハシボソ/ミヤマ/カササギ)。A+B の lean soup を採用
    #   (KD効果ゼロ=lean, grade緩和不要, 複合不要=4種そのまま。録音単位f1≈0.88)。
    stage2_model: "models/ast-crow-AB-lean-soup"
    # 2026-06-14 Phase4 OOD energy ゲート(tools/ood_fp_audit.py, lean-soup, AST単独監査):
    #   録音単位AUROC(在群vs非同科)=0.824 / 在群vs同科Corvidae=0.906。
    #   同属Corvus(Northern Raven 等)でも崩壊せず(Raven rec_leak0.10)=crow壁無し(カモのカルガモ壁と別物)。
    #   動作点「在群最優先・保持>=0.90」→ 閾値2.610で 在群保持0.902 / 非同科FP0.35 / 同科他種漏れ0.115。
    #   閾値はXeno-canto域の暫定=デプロイ後フィールド再キャリブレ必須。複合(display_groups)は不要。
    energy_threshold: 2.610
    energy_temperature: 1.0
